<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thitiyapa Jaiboon - Profile</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            padding: 40px;
        }
        .card {
            max-width: 500px;
            margin: auto;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 24px;
            background-color: #111111;
        }
        .profile-img {
            display: block;
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #444444;
            margin: 0 auto 20px auto;
        }
        h1 {
            margin-top: 0;
            color: #f5f5f5;
            border-bottom: 1px solid #333333;
            padding-bottom: 10px;
            text-align: center;
        }
        p {
            font-size: 16px;
            margin: 12px 0;
        }
        .label {
            color: #aaaaaa;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="3110.jpg" alt="Thitiyapa Jaiboon" class="3110-img">
        <h1>Thitiyapa Jaiboon</h1>
        <p><span class="label">Age:</span> 20</p>
        <p><span class="label">Hobby:</span> Write a novel</p>
        <p><span class="label">Favorite Color:</span> Black</p>
        <p><span class="label">Future Careers:</span> Cafe and bakery owner</p>
    </div>
</body>
</html>
